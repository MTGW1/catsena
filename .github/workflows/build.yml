name: build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (gcc, POSIX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 + 全部自测
        run: make

      # 注意: `grep -c` 在匹配数为 0 时退出码是 1, 而 `bash -e` 会把这种失败当脚本中止 ——
      # 也就是说"断言 cJSON 泄漏为 0"这个检查在真的为 0 时反而会红。所以必须 `|| true`。
      - name: 导出面纪律(51 个 map_* / 0 个 cJSON)
        run: |
          n=$(nm -D --defined-only catsena.so | grep -c ' T map_' || true)
          c=$(nm -D --defined-only catsena.so | grep -c ' T cJSON' || true)
          echo "map_* = $n, cJSON = $c"
          test "$n" = "51"
          test "$c" = "0"

      - name: 导出表是否与公开头文件一致
        run: python3 tools/genexports.py --check

      - name: FFI 烟雾测试(ctypes 加载 .so)
        run: python3 _ffi_smoke.py

  windows:
    name: Windows (MinGW, PE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc make

      # MSYS2 下 make 用 sh(不是 cmd), 所以 Makefile 里的运行前缀按 MSYSTEM 判定为 ./
      - name: 构建 + 全部自测
        shell: msys2 {0}
        run: make

      - name: 导出面纪律(cJSON 必须 0)
        shell: msys2 {0}
        run: |
          c=$(objdump -p catsena.dll | grep -c 'cJSON_' || true)
          echo "cJSON 导出 = $c"
          test "$c" = "0"
